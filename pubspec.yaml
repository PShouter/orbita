name: orbita
description: "A new Flutter project."
publish_to: 'none'

version: 0.4.4+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.2
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.7+1
  intl: ^0.20.3
  markdown: ^7.3.1
  crypto: ^3.0.3
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  path_provider: ^2.1.6
  local_auth: ^3.0.2
  encrypt: ^5.0.3
  flutter_riverpod: ^3.4.3
  sqflite: ^2.4.4+1
  path: ^1.9.1
  connectivity_plus: ^7.3.1
  share_plus: ^10.0.0
  uuid: ^4.6.0
  file_saver: ^0.7.0
  pdf: ^3.13.1
  printing: ^5.15.1
  permission_handler: ^11.3.1
  package_info_plus: ^9.0.1
  ota_update: ^7.1.0
  file_picker: ^10.0.0
  open_filex: ^4.5.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/norm/
    - assets/fonts/
    - .env

  fonts:
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-Regular.ttf
          weight: 400
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700

    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700